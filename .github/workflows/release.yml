# Docker images are published from the internal build host because
# registry.gromas.ru is not resolvable from GitHub-hosted runners.
# This workflow builds binaries and creates the GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Resolve version
      id: version
      run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build binaries
      run: |
        # Build DNS Collector
        cd dns-collector
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dns-collector-linux-amd64 ./cmd/dns-collector
        tar -czf ../dns-collector-linux-amd64.tar.gz dns-collector-linux-amd64 config/
        cd ..

        # Build Web API
        cd web-api
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o web-api-linux-amd64 ./cmd/
        tar -czf ../web-api-linux-amd64.tar.gz web-api-linux-amd64 config/
        cd ..

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dns-collector-linux-amd64.tar.gz
          web-api-linux-amd64.tar.gz
        body: |
          ## DNS Collector Release ${{ github.ref_name }}

          ### Docker Images

          Published from the internal build host:
          - `registry.gromas.ru/apps/dns-collector/dns-collector:${{ steps.version.outputs.value }}`
          - `registry.gromas.ru/apps/dns-collector/web-api:${{ steps.version.outputs.value }}`

          ### Installation

          Download the appropriate binary for your platform and extract it:

          ```bash
          tar -xzf dns-collector-linux-amd64.tar.gz
          cd dns-collector-linux-amd64
          ./dns-collector-linux-amd64 -config config/config.yaml
          ```

          **Note**: PostgreSQL database is required. Configure connection settings in config/config.yaml or via environment variables.

          For more information, see [README.md](https://github.com/grom-alex/dns-collector/blob/main/README.md)
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
