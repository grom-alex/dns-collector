name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.gromas.ru

jobs:
  docker:
    name: Docker ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dns-collector
            context: ./dns-collector
            image: apps/dns-collector/dns-collector
          - name: web-api
            context: ./web-api
            image: apps/dns-collector/web-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binaries
        run: |
          # Build DNS Collector
          cd dns-collector
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dns-collector-linux-amd64 ./cmd/dns-collector
          tar -czf ../dns-collector-linux-amd64.tar.gz dns-collector-linux-amd64 config/
          cd ..

          # Build Web API
          cd web-api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o web-api-linux-amd64 ./cmd/
          tar -czf ../web-api-linux-amd64.tar.gz web-api-linux-amd64 config/
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dns-collector-linux-amd64.tar.gz
            web-api-linux-amd64.tar.gz
          body: |
            ## DNS Collector Release ${{ github.ref_name }}

            ### Docker Images
            - ${{ env.REGISTRY }}/apps/dns-collector/dns-collector:${{ steps.version.outputs.value }}
            - ${{ env.REGISTRY }}/apps/dns-collector/web-api:${{ steps.version.outputs.value }}

            ### Installation

            Download the appropriate binary for your platform and extract it:

            ```bash
            tar -xzf dns-collector-linux-amd64.tar.gz
            cd dns-collector-linux-amd64
            ./dns-collector-linux-amd64 -config config/config.yaml
            ```

            **Note**: PostgreSQL database is required. Configure connection settings in config/config.yaml or via environment variables.

            For more information, see [README.md](https://github.com/grom-alex/dns-collector/blob/main/README.md)
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
